# Archivr on the cluster. Apply with `kubectl apply -f deploy/k8s/archivr.yaml`
# after creating the secret below. Nothing here is applied automatically.
#
#   kubectl -n archivr create secret generic archivr-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=INIT_PASSWORD="<first admin password>"
#
# INIT_PASSWORD is applied on every start while it is set: it resets that admin's password
# and role. Once you can sign in, remove it from the secret and remove the env entry below.
#
# Sign-in is configured in the admin screens after first start. The OIDC client is
# registered in Authelia (k8s-prod/v2/authelia.yaml), with the redirect URI
# https://archive.tynsoe.org/api/v1/auth/oidc/callback.
apiVersion: v1
kind: Namespace
metadata:
  name: archivr
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: archivr
  namespace: archivr
spec:
  serviceName: archivr
  replicas: 1 # SQLite and the file tree live on one volume; do not scale out.
  selector:
    matchLabels:
      app: archivr
  template:
    metadata:
      labels:
        app: archivr
    spec:
      terminationGracePeriodSeconds: 30 # lets running OCR jobs finish or stop cleanly
      securityContext:
        fsGroup: 1000
      containers:
      - name: archivr
        image: REPLACE_WITH_YOUR_REGISTRY/archivr:latest # the image you build and push from the Dockerfile
        env:
          - name: PUBLIC_URL
            value: "https://archive.tynsoe.org"
          - name: TRUST_PROXY
            value: "1" # Traefik sets X-Forwarded-For and X-Forwarded-Proto
          - name: INIT_ADMIN_EMAIL # the first admin, created on first start only
            value: "REPLACE_WITH_ADMIN_EMAIL"
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: archivr-secrets
                key: JWT_SECRET
          - name: INIT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: archivr-secrets
                key: INIT_PASSWORD
        ports:
        - containerPort: 8080
          name: web
        readinessProbe:
          httpGet:
            path: /healthz
            port: web
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: archivr
  namespace: archivr
spec:
  selector:
    app: archivr
  ports:
  - port: 80
    targetPort: web
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: archivr
  namespace: archivr
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`archive.tynsoe.org`)
    kind: Rule
    services:
    - name: archivr
      kind: Service
      port: 80
  tls:
    certResolver: cloudflare
    domains:
    - main: archive.tynsoe.org
